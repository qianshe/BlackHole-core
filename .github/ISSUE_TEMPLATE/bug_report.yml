name: Bug report / 问题反馈
description: Report a reproducible Core or VS Code problem without private data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Security issue? Use the private Security report link instead.
        请勿粘贴 auth.json、Token、会话链接、Cookie、卡密、私钥或未脱敏日志。
  - type: input
    id: version
    attributes:
      label: BlackHole version or commit / 版本或提交
      description: State whether this is a Marketplace build, local VSIX, or source checkout.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 环境
      description: OS/version, CPU architecture, VS Code version, and local/remote extension host.
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build environment / 构建环境
      options:
        - Production / 正式
        - Test / 测试
        - Unknown / 不确定
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / 复现步骤
      description: Minimal steps with synthetic data, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted evidence / 脱敏证据
      description: Relevant error codes only. Do not upload credentials, a user database, or entire logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私确认
      options:
        - label: I removed secrets and personal data, and this is not a confidential vulnerability report.
          required: true
