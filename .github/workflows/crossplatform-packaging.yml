name: Cross-platform Core packaging

# Manual-only first-iteration packaging matrix for non-Windows hosts: builds
# the platform-bound signed Core archive and host-node VSIX natively on each
# runner using ONE persistent CI test key (secret BH_CROSSPLATFORM_TEST_KEY,
# key id test-ci-crossplatform). Artifacts are candidates for review, never
# auto-published to a release. Windows x64 keeps the established local-test
# pipeline; this matrix exists to validate linux/darwin packaging end to end.
on:
  workflow_dispatch:
  push:
    branches: [feat/connection-target-routing]
    paths: ['.github/workflows/crossplatform-packaging.yml', 'scripts/assemble-core-runtime.mjs', 'scripts/package-vsix.mjs', 'scripts/vsix-host-layout.mjs', 'scripts/package-core-runtime.mjs', 'packages/**', 'src/**']

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-22.04, platform: linux, arch: x64 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { name: macos-x64, runner: macos-15-intel, platform: darwin, arch: x64 }
          - { name: macos-arm64, runner: macos-15, platform: darwin, arch: arm64 }
    env:
      BH_PACKAGE_PLATFORM: ${{ matrix.platform }}
      BH_PACKAGE_ARCH: ${{ matrix.arch }}
      BH_SEED_CORE_KEY_ID: test-ci-crossplatform
      TEST_CLOUD_ORIGIN: https://blackhole-cloud-api-test.cutoffother.workers.dev
      TEST_ENTITLEMENT_PUBLIC_KEY: MCowBQYDK2VwAyEA1NU2RKaQC8fRNUGFT8ID2LWptYo1Aucw20u4lvojWts=
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache-dependency-path: packages/desktop-launcher/go.sum
      - name: Install dependencies (native koffi prebuild per platform)
        run: pnpm install --frozen-lockfile
      - name: Build contracts, daemon, web and hosts
        run: |
          pnpm build
          pnpm --dir packages/web build
          node packages/host-runtime/build.mjs --environment test
          node packages/vscode/esbuild.mjs --environment test
        env:
          BLACKHOLE_TEST_CLOUD_ORIGIN: ${{ env.TEST_CLOUD_ORIGIN }}
          BLACKHOLE_TEST_CLOUD_PUBLIC_KEY: ${{ env.TEST_ENTITLEMENT_PUBLIC_KEY }}
      - name: Assemble platform Core layout
        run: |
          mkdir -p staging
          node scripts/assemble-core-runtime.mjs --output staging/layout --without-node --platform "$BH_PACKAGE_PLATFORM" --arch "$BH_PACKAGE_ARCH"
      - name: Sign Core archive with the persistent CI test key
        run: |
          version=$(node -p "require('./package.json').version")
          build_id="ci-${{ matrix.platform }}-${{ matrix.arch }}-${GITHUB_SHA:0:7}"
          printf '%s' "$BH_CROSSPLATFORM_TEST_KEY" > staging/ci-key.pem
          node scripts/package-core-runtime.mjs \
            --input staging/layout \
            --output "staging/core-${BH_PACKAGE_PLATFORM}-${BH_PACKAGE_ARCH}.zip" \
            --private-key staging/ci-key.pem \
            --key-id test-ci-crossplatform \
            --runtime-version "$version" \
            --build-id "$build_id" \
            --platform "$BH_PACKAGE_PLATFORM" \
            --arch "$BH_PACKAGE_ARCH" \
            --environment test \
            --cloud-origin "$TEST_CLOUD_ORIGIN" \
            --daemon-version "$version" \
            --web-build-id "$build_id" \
            --runtime-provider host-node \
            --node-min-version 22.13.0
          rm staging/ci-key.pem
      - name: Package host-node VSIX embedding the signed Core
        run: |
          version=$(node -p "require('./package.json').version")
          BH_SEED_CORE_ARCHIVE="$PWD/staging/core-${BH_PACKAGE_PLATFORM}-${BH_PACKAGE_ARCH}.zip" \
          BH_SEED_CORE_PUBLIC_KEY="$PWD/.github/workflows/ci-test-core-public.pem" \
          node scripts/package-vsix.mjs --environment test --core-package offline-code \
            --out "staging/blackhole-vscode-${version}-test-${BH_PACKAGE_PLATFORM}-${BH_PACKAGE_ARCH}.vsix"
        env:
          BLACKHOLE_TEST_CLOUD_ORIGIN: ${{ env.TEST_CLOUD_ORIGIN }}
          BLACKHOLE_TEST_CLOUD_PUBLIC_KEY: ${{ env.TEST_ENTITLEMENT_PUBLIC_KEY }}
      - name: Audit the packaged VSIX
        run: |
          ls staging/*.vsix | head -1 | xargs node scripts/audit-universal-vsix.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: blackhole-crossplatform-${{ matrix.platform }}-${{ matrix.arch }}
          path: staging/*.vsix
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: blackhole-crossplatform-core-${{ matrix.platform }}-${{ matrix.arch }}
          path: staging/core-*.zip
          retention-days: 14
