name: Core Runtime CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify change
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Skip native jobs only for explicitly documentation-only changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          base = os.environ.get('BASE_SHA', '')
          run = True
          if os.environ['EVENT_NAME'] != 'workflow_dispatch' and base and set(base) != {'0'}:
              result = subprocess.run(['git', 'diff', '--name-only', '-z', base, os.environ['HEAD_SHA']], capture_output=True)
              # An unreachable base (force-push, shallow history) runs everything instead of failing CI.
              paths = result.stdout.decode().split('\0') if result.returncode == 0 else ['<unknown>']
              docs = {'README.md', 'README.zh-CN.md', 'MIGRATION-STATUS.md', 'CONTRIBUTING.md', 'SECURITY.md', 'RELEASE-VALIDATION.md', 'LICENSE', 'NOTICE', '.github/CI.md', '.github/PULL_REQUEST_TEMPLATE.md'}
              run = any(p and p not in docs and not p.startswith('.github/ISSUE_TEMPLATE/') for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('code=' + str(run).lower() + '\n')
          PY

  runtime:
    name: Runtime (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows-x64, runner: windows-2022, platform: win32, arch: x64 }
          - { name: Linux-x64, runner: ubuntu-22.04, platform: linux, arch: x64 }
          - { name: Linux-arm64, runner: ubuntu-22.04-arm, platform: linux, arch: arm64 }
          - { name: macOS-Intel, runner: macos-15-intel, platform: darwin, arch: x64 }
          - { name: macOS-ARM, runner: macos-15, platform: darwin, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      EXPECT_PLATFORM: ${{ matrix.platform }}
      EXPECT_ARCH: ${{ matrix.arch }}
      # Skill tests run inside test:pack / test:posix; fail instead of skipping when symlinks are unavailable.
      BH_REQUIRE_SKILL_SYMLINKS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Verify native runtime, not an emulated architecture
        run: node -e "if(process.platform!==process.env.EXPECT_PLATFORM||process.arch!==process.env.EXPECT_ARCH)process.exit(1);console.log(process.platform,process.arch,process.version)"
      - name: Linux sandbox prerequisite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Bundled npm license notices are current
        if: matrix.name == 'Linux-x64'
        run: node scripts/third-party-licenses.mjs --check
      - name: Environment selection, contracts and release notes
        run: pnpm test:build-flavor && pnpm test:contracts && pnpm test:changelog
      - name: Handoff (includes daemon build and extension typecheck)
        run: pnpm test:handoff
      - name: Local Web and account tests with isolated data
        run: pnpm test:local-web
      - name: Tunnel installers (no real downloads)
        run: node --test --experimental-test-isolation=none packages/vscode/test/cloudflared-install.test.mjs packages/vscode/test/openai-tunnel-install.test.mjs
      - name: Desktop bootstrap against an isolated daemon
        if: matrix.name == 'Linux-x64'
        run: pnpm test:host-runtime
      - name: Settings and daemon recovery without real downloads
        run: node --test --experimental-test-isolation=none packages/vscode/test/panel-lifecycle.test.mjs packages/vscode/test/daemon-restart.test.mjs packages/vscode/test/restart-recovery.test.mjs packages/vscode/test/daemon-manager-live.test.mjs packages/vscode/test/extension-polling.test.mjs packages/vscode/test/web-agents.test.mjs scripts/daemon-startup-race.test.mjs
      - name: Account restoration and entitlement with synthetic credentials
        run: node packages/vscode/test/prepare-cloud-auth.mjs && node --test --experimental-test-isolation=none packages/vscode/test/cloud-auth.test.mjs packages/vscode/test/statusbar-copy.test.mjs && node scripts/entitlement-http-smoke.mjs
      - name: Presentation and channel switching
        run: node --test --experimental-test-isolation=none scripts/quick-show.test.mjs && node scripts/verify-tunnel-switch.mjs
      - name: Core execution discovery
        run: pnpm test:execution:core
      - name: Windows PATH contexts
        if: runner.os == 'Windows'
        run: node --test scripts/windows-path-context.test.mjs
      - name: Windows behavioral and proxy gate
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm test:pack
      - name: Windows managed processes and finite execution
        if: runner.os == 'Windows'
        run: pnpm test:process && pnpm test:execution
      - name: Packed extension daemon (bundled native modules, file credential storage)
        if: runner.os == 'Windows'
        run: pnpm test:execution:packed
      - name: POSIX protocol and proxy gate
        if: runner.os != 'Windows'
        run: pnpm test:posix
      - name: Native POSIX sandbox and managed processes (no missing-backend skips)
        if: runner.os != 'Windows'
        env:
          BH_REQUIRE_SANDBOX: '1'
        run: pnpm test:process:posix
      - name: macOS nested Seatbelt classification
        if: runner.os == 'macOS'
        run: node --test scripts/macos-seatbelt-nested.test.mjs
      - name: Minimal failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: core-execution-${{ matrix.name }}-${{ github.run_attempt }}
          path: .cache/core-execution/*.json
          if-no-files-found: ignore
          retention-days: 3

  openai-runtime-native:
    name: OpenAI runtime native (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows-x64, runner: windows-2022, platform: win32, arch: x64 }
          - { name: Windows-arm64, runner: windows-11-arm, platform: win32, arch: arm64 }
          - { name: Linux-x64, runner: ubuntu-22.04, platform: linux, arch: x64 }
          - { name: Linux-arm64, runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { name: macOS-Intel, runner: macos-15-intel, platform: darwin, arch: x64 }
          - { name: macOS-ARM, runner: macos-15, platform: darwin, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      EXPECT_PLATFORM: ${{ matrix.platform }}
      EXPECT_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download, verify and execute the pinned pure runtime on this native architecture
        run: pnpm test:openai-tunnel-runtime:native

  ci-result:
    name: Core CI
    if: always()
    needs: [changes, runtime, openai-runtime-native]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require applicable jobs; documentation-only changes may skip native jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RUNTIME: ${{ needs.runtime.result }}
          OPENAI_NATIVE: ${{ needs.openai-runtime-native.result }}
        run: |
          test "$CHANGES" = success
          if [ "$CODE" = true ]; then
            test "$RUNTIME" = success
            test "$OPENAI_NATIVE" = success
          else
            test "$CODE" = false
            test "$RUNTIME" = skipped
            test "$OPENAI_NATIVE" = skipped
          fi
