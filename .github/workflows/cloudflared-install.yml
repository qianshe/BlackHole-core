name: Cloudflared Install CI

on:
  pull_request:
    paths:
      - 'packages/vscode/src/cloudflaredInstall.ts'
      - 'packages/vscode/test/cloudflared-install*.test.mjs'
      - '.github/workflows/cloudflared-install.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/vscode/src/cloudflaredInstall.ts'
      - 'packages/vscode/test/cloudflared-install*.test.mjs'
      - '.github/workflows/cloudflared-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-and-install:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: win32
            arch: x64
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - name: macOS arm64
            runner: macos-latest
            platform: darwin
            arch: arm64
          - name: macOS x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Installer unit tests
        run: node --test --experimental-test-isolation=none packages/vscode/test/cloudflared-install.test.mjs
      - name: Real download, verification, reuse and PATH detection
        env:
          BH_CLOUDFLARED_LIVE: '1'
          BH_EXPECTED_PLATFORM: ${{ matrix.platform }}
          BH_EXPECTED_ARCH: ${{ matrix.arch }}
        run: node --test --experimental-test-isolation=none packages/vscode/test/cloudflared-install-live.test.mjs
